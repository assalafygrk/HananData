name: hanan_data
description: HananData — Nigerian VTU Service App
publish_to: 'none'
version: 2.4.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  connectivity_plus: ^7.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.1.2
  google_fonts: ^8.2.0
  http: ^1.6.0
  in_app_review: ^2.0.12
  local_auth: ^3.0.2
  path_provider: ^2.1.6
  screenshot: ^3.0.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/providers/
